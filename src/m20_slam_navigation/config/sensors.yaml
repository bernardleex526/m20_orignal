# ============================================================================
# M20 Pro Quadruped SLAM & Navigation — Sensor Configuration
# ============================================================================
# Defines sensor intrinsics, extrinsics, and noise parameters.
# All units: SI (meters, radians, seconds).

sensors:
  lidar:
    model: "Livox_Mid-360"                # Non-repetitive scanning LiDAR
    scan_lines: 0                          # 0 = non-repetitive pattern
    min_range: 0.1                         # [m] minimum detection range
    max_range: 200.0                       # [m] maximum detection range
    hz: 10.0                               # scan frequency
    point_cloud_topic: "/LIDAR/pointcloud"
    frame_id: "lidar_link"

  imu:
    model: "Bosch_BMI088"                 # or ICM-20948
    hz: 200.0                              # output rate [Hz]
    accel_noise: 0.01                      # accelerometer white noise σ [m/s²/√Hz]
    gyro_noise: 0.0001745                  # gyroscope white noise σ [rad/s/√Hz] ≈ 0.01°/s
    accel_bias_rw: 0.0002                  # accel bias random walk [m/s³/√Hz]
    gyro_bias_rw: 0.000003                 # gyro bias random walk [rad/s²/√Hz]
    topic: "/IMU"
    frame_id: "imu_link"

  odometry:
    model: "AOS_Foot_Kinematics"           # Contact-based leg odometry
    hz: 100.0                              # update rate [Hz]
    slip_ratio: 0.02                       # expected slip ratio (2%)
    topic: "/ODOM"

  # Extrinsic calibration: T_lidar_imu (LiDAR pose in IMU frame)
  extrinsics:
    lidar_to_imu:
      translation: [0.15, 0.0, 0.05]       # x=forward, y=left, z=up [m]
      rotation: [0.0, 0.0, 0.0, 1.0]       # quaternion [w, x, y, z]

    imu_to_base:
      translation: [0.0, 0.0, 0.0]
      rotation: [1.0, 0.0, 0.0, 0.0]

    base_to_lidar:
      translation: [0.15, 0.0, 0.05]
      rotation: [1.0, 0.0, 0.0, 0.0]

# ============================================================================
# Coordinate frames
# ============================================================================
frames:
  world: "map"
  odom:  "odom"
  base:  "base_link"
  lidar: "lidar_link"
  imu:   "imu_link"