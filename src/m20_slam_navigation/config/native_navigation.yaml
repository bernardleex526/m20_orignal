# M20Pro native navigation contract for navigation_node.
#
# The values below are copied from the deployed native planner/passable_area
# YAMLs.  `navigation.enable_motion_output` is deliberately false: planning,
# diagnostics and all native contracts can be validated without sending a
# motion command.  Enable it only after the real robot command chain has been
# separately approved.

navigation_node:
  ros__parameters:
    navigation.world_frame: "camera_init"
    navigation.body_frame: "base_link"
    navigation.enable_motion_output: false
    navigation.use_native_dds: true

    drdds.domain_id: 0
    drdds.use_shm: false
    drdds.topic_prefix: "rt"
    drdds.network_name: ""

    native.topics.grid_map: "/GRID_MAP"
    native.topics.initial_pose: "/initialpose"
    native.topics.goal_pose: "/goal_pose"
    native.topics.goal_global_service: "/GOAL_GLOBAL"
    native.topics.odom: "/ODOM"
    native.topics.motion_info: "/MOTION_INFO"
    native.topics.nav_points: "/NAV_POINTS"
    native.topics.cancel_nav: "/CANCEL_NAV"
    native.topics.cancel_global_service: "/CANCEL_NAV_GLOBAL"
    native.topics.planner_mode: "/planner_mode"
    native.topics.astar_path: "/path_Astar"
    native.topics.visible_points: "/vis_global_points"
    native.topics.pruned_visible_points: "/vis_global_points_pruned"
    native.topics.local_goal: "/local_goal"
    native.topics.local_map: "/local_map"
    native.topics.global_planner_status: "/GLOBAL_PLANNER_STATUS"
    native.topics.nav_cmd: "/NAV_CMD"
    native.topics.planner_status: "/PLANNER_STATUS"
    native.topics.target_goal: "/target_goal"
    native.topics.goal_baselink: "/goal_baselink"
    native.topics.local_goal_baselink: "/local_goal_baselink"
    native.topics.free_paths: "/free_paths"
    native.topics.local_path: "/local_path"
    native.topics.local_scans: "/local_scans"
    native.topics.track_path_baselink: "/track_path_baselink"
    native.topics.global_path: "/global_path"
    native.topics.grid_map_3d: "/grid_map_3d"
    native.topics.global_path_markers: "/global_path_markers"
    native.topics.set_param_service: "/set_service"
    native.topics.cancel_planner_service: "/CANCEL_NAV_PLANNER"
    native.topics.goal_planner_service: "/GOAL_PLANNER"

    terrain.grid_resolution: 0.05
    terrain.map_length: 8.0
    terrain.map_width: 8.0
    terrain.map_height_min: -1.0
    terrain.map_height_max: 0.8
    terrain.voxel_size: 0.05
    terrain.max_drop: 0.25
    terrain.max_roughness: 0.10
    terrain.max_slope_deg: 89.0
    terrain.max_inpaint_pixels: 200
    terrain.enable_center_padding: true
    terrain.center_dist_thresh: 0.8
    terrain.enable_blind_check: false
    terrain.treat_nan_as_stiff: true
    terrain.accumulate_cloud_topic: "/accumulate_cloud/cloud_gravity"
    terrain.imu_topic: "/IMU"
    terrain.passable_cloud_topic: "/passable_area"
    terrain.impassable_cloud_topic: "/impassable_area"
    terrain.grid_map_topic: "/grid_map"
    terrain.traversal_cost_topic: "/traversal_cost"
    terrain.world_frame: "camera_init"
    terrain.gravity_frame: "base_gravity"
    terrain.body_frame: "base_link"
    terrain.used_frame: "base_gravity"
    terrain.dog_model: "m20"
    terrain.raycast.enable: true
    terrain.raycast.max_ray_distance: 4.0
    terrain.raycast.max_nan_gap: 3.0
    terrain.elevation_solver.use_histogram_solver: false
    terrain.elevation_solver.histogram_bins: 20
    terrain.elevation_solver.region_enabled: true
    terrain.elevation_solver.region_min_x: -3.0
    terrain.elevation_solver.region_max_x: 3.0
    terrain.elevation_solver.region_min_y: -1.0
    terrain.elevation_solver.region_max_y: 1.0
    pcl_pass_grid.out_minx: -4.0
    pcl_pass_grid.out_maxx: 4.0
    pcl_pass_grid.out_miny: -4.0
    pcl_pass_grid.out_maxy: 4.0
    pcl_pass_grid.out_minz: -0.30
    pcl_pass_grid.out_maxz: 0.6
    pcl_pass_grid.in_minx: -0.45
    pcl_pass_grid.in_maxx: 0.45
    pcl_pass_grid.in_miny: -0.25
    pcl_pass_grid.in_maxy: 0.25
    pcl_pass_grid.in_minz: -0.30
    pcl_pass_grid.in_maxz: 0.6
    pcl_pass_grid.serach_radius: 0.1
    pcl_pass_grid.minNeighbors: 4
    pcl_pass_grid.leaf_size: 0.01
    terrain.traversal_cost.enable: true
    terrain.traversal_cost.slope_free_deg: 10.0
    terrain.traversal_cost.slope_block_deg: 80.0
    terrain.traversal_cost.rough_free: 0.01
    terrain.traversal_cost.rough_block: 0.04
    terrain.traversal_cost.step_free: 0.08
    terrain.traversal_cost.step_block: 0.35
    terrain.traversal_cost.slope_weight: 0.3
    terrain.traversal_cost.roughness_weight: 0.3
    terrain.traversal_cost.step_weight: 0.4
    terrain.traversal_cost.easy_cost: 0.0
    terrain.traversal_cost.hard_cost: 90.0
    terrain.traversal_cost.max_cost: 100.0
    terrain.traversal_cost.missing_cost: 20.0
    terrain.traversal_cost.curve_power: 1.0
    terrain.traversal_cost.low_cost_filter_ratio: 0.1
    terrain.traversal_cost.terrain_sample_window: 1
    terrain.traversal_cost.safe_zone_side_length: 0.6

    # Compatibility fields consumed by the local 2.5D fallback.
    terrain.max_range: 30.0
    terrain.min_range: 0.3
    terrain.max_climb_angle: 1.5533430343
    terrain.slope_weight: 0.3
    terrain.roughness_threshold: 0.10
    terrain.roughness_weight: 0.3
    terrain.max_step_height: 0.25
    terrain.max_step_depth: 0.25
    terrain.step_weight: 0.4
    terrain.normal_estimation_radius: 0.10

    global.weight_a: 1.0
    global.weight_b: 1.3
    global.weight_heading: 0.8
    global.cost_steer: 1.0
    global.cost_steerchange: 0.2
    global.cost_gear: 2.0
    global.cost_backward: 1.5
    global.cost_reduce: 0.85
    global.step_size: 0.4
    global.sample_interval: 0.2
    global.bodyLength: 0.45
    global.bodyWidth: 0.45
    global.max_steer: 0.9
    global.num_steerind: 3
    global.goalDis: 0.5
    global.dynamic_update: false
    global.test_mode: false
    global.xy_tolerance: 0.5
    global.dynamic_map_size: 3.0
    global.dynamic_map_grid: 30
    global.astar_time: 1.0
    global.debug_point_num: 7
    global.enable_smoothing: true
    global.smooth_count: 7
    global.smooth_degree: 3
    global.num_samples: 7
    global.angle_threshold: 60.0
    global.local_goal_freq_hz: 10.0
    global.max_trajectory_range_: 2.0
    global.local_point_dis_: 0.0
    global.local_point_dis_v_max_: 0.0
    global.max_speed_x_: 1.0
    global.sharp_turn_angle_: 45.0
    global.local_goal_search_window_: 10

    # The native global config has no standalone map resolution; 0.1 m is the
    # deployed planner discretization used by this adapter.
    planner.grid_resolution: 0.1
    planner.num_heading_bins: 72
    planner.max_curvature: 0.5
    planner.primitive_length: 0.4
    planner.num_directions: 8
    planner.num_rotations: 3
    planner.heuristic_weight: 1.0
    planner.time_limit_sec: 1.0
    planner.max_expansions: 100000
    planner.spline_smoothness_weight: 0.4

    local.lookAheadDis: 1.5
    local.maxSpeedX: 1.5
    local.maxSpeedY: 0.6
    local.maxTheta: 1.0
    local.barking_deceleration: 1.0
    local.stop_distance: 0.7
    local.max_v_threshold: 1.2
    local.robotLength: 0.84
    local.robotWidth: 0.5
    local.sensorOffsetX: 0.0
    local.sensorOffsetY: 0.0
    local.obstacleHeightThre: 0.10
    local.goal_in_ob_dis: 0.25
    local.goal_in_ob_z: 0.5
    local.pointPerPathThre: 1
    local.input_source: "/NAV_POINTS"
    local.grid_size_: 0.05
    local.grid_occu_num_: 2
    local.enable_cloud_stacking: false
    local.cloud_stack_size: 1
    local.directLine_mode: true
    local.judge_close: false
    local.change_close: true
    local.backward_mode: false
    local.judge_turn: false
    local.xy_tolerance: 0.1
    local.yaw_tolerance: 0.1
    local.block_number: 1
    local.dwa_fine_tune_distance: 0.5
    local.weight_goal: 1.0
    local.weight_yaw: 0.5
    local.weight_spdy: 0.2
    local.weight_ob1: 0.6
    local.weight_ob2: 0.8
    local.weight_ob3: 1.0
    local.local_point_dis: 3.0
    local.local_point_dis_v_max: 5.0
    local.local_try: true
    local.path_num: 4641
    local.path_sample_num: 10
    local.grid_voxel_size: 0.05
    local.grid_voxel_offset_x: -1.475
    local.grid_voxel_offset_y: -1.975
    local.grid_voxel_num_x: 90
    local.grid_voxel_num_y: 80
    local.turn_yaw_kp: 1.5
    local.angleThreshold: 30.0
    local.sumAngleThreshold: 75.0
    local.minSegmentLength: 0.02
    local.trackDis: 1.5
    local.speed_ratio: 1.0
    local.speed_ratio_yaw: 1.0
    local.dl_min_yaw: 0.7
    local.dl_min_x: 0.25
    local.dl_min_y: 0.25
    local.pl_min_yaw: 0.25
    local.pl_min_x: 0.25
    local.pl_min_y: 0.25
    local.dl_line_yaw_min: 0.2
    local.close_deceleration: 1.0
    local.proximity_distance: 0.5
    local.warning_threshold: 10.0
    local.vel_acc_threshold: 1.0
    local.x_acc_increment: 0.05
    local.count_num: 10
    local.only_rotate_yaw: 0.35
    local.adjust_yaw_min_: 1.0
    local.rotate_detect_dis: 0.0
    local.turn_approach_threshold: 0.2
    local.monitor_loop_frequency: 10.0
    local.sharp_turn_angle: 60.0

    # Compatibility controller names map to native localPlanner limits.
    controller.max_linear_vel_x: 1.5
    controller.max_linear_vel_y: 0.6
    controller.max_angular_vel: 1.0
    controller.max_linear_accel_x: 1.0
    controller.max_linear_accel_y: 1.0
    controller.max_angular_accel: 1.0
    controller.num_vx_samples: 10
    controller.num_vy_samples: 5
    controller.num_omega_samples: 10
    controller.sim_time: 2.0
    controller.sim_dt: 0.1
    controller.weight_path_clearance: 0.6
    controller.weight_goal_align: 1.0
    controller.weight_velocity_progress: 0.2
    controller.weight_terrain_cost: 0.8
    controller.weight_smoothness: 0.5
    controller.lineplanner_lateral_gain: 1.5
    controller.lineplanner_yaw_threshold: 0.2
