# ============================================================================
# Back-End Factor Graph Optimization Parameters
# ============================================================================

backend:
  # ---- Factor Noise Models ----
  lio_odom_noise_trans: 0.1               # [m] relative translation noise σ
  lio_odom_noise_rot: 0.05                 # [rad] relative rotation noise σ
  gravity_noise_sigma: 0.01                # [m/s²] gravity factor noise
  loop_closure_noise_trans: 0.5            # [m] loop closure translation noise
  loop_closure_noise_rot: 0.1              # [rad] loop closure rotation noise

  # ---- Degeneracy Detection (Long Corridors) ----
  enable_degeneracy_fallback: true
  degeneracy_threshold: 10.0               # λ_min < λ_max / 10 → degenerate
  degeneracy_heading_align: 0.9            # cos(25°) → alignment threshold

  # ---- iSAM2 Incremental Solver ----
  isam2_relinearize_skip: 1                # relinearize every N steps
  isam2_wildfire_threshold: 0.001          # δ threshold for wildfire relinearization

  # ---- Loop Closure Detection (ScanContext) ----
  scan_context_rings: 20                   # number of ring bins
  scan_context_sectors: 60                 # number of sector bins
  scan_context_ring_key_threshold: 0.3     # ring key cosine distance threshold
  scan_context_distance_threshold: 0.25    # full descriptor distance threshold
  loop_closure_radius: 15.0                # [m] radius search for geometric verification
  loop_closure_skip_frames: 50             # minimum frames between loop candidates
  max_database_size: 1000                  # max keyframes in loop database