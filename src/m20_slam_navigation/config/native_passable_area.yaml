    traversal_cost.step_weight: 0.4
    traversal_cost.easy_cost: 0.0
    traversal_cost.hard_cost: 90.0
    traversal_cost.max_cost: 100.0
    traversal_cost.missing_cost: 20.0
    traversal_cost.curve_power: 1.0
    traversal_cost.low_cost_filter_ratio: 0.1
    traversal_cost.terrain_sample_window: 1
    traversal_cost.safe_zone_side_length: 0.6
