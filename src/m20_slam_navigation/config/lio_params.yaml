# ============================================================================
# LIO Front-End Odometry Parameters
# ============================================================================

lio:
  # ---- Voxel Map ----
  voxel_size: 0.5                          # [m] voxel edge length
  max_voxels: 100000                        # maximum voxels in map (prune farthest)
  voxel_map_range: 100.0                   # [m] radius of voxel map

  # ---- Keyframe Selection ----
  keyframe_distance: 0.5                   # [m] min translation to insert keyframe
  keyframe_angle: 0.2                      # [rad] min rotation to insert keyframe (~11.5°)

  # ---- FastVAGICP Registration ----
  max_iterations: 30                       # Gauss-Newton iterations
  convergence_threshold: 0.001             # relative cost change tolerance
  correspondence_radius: 1.0               # [m] max correspondence search radius
  num_threads: 4                           # OpenMP threads

  # ---- IMU Integration ----
  imu_integration_dt: 0.005                # [s] integration time step (200Hz)
  gravity: [0.0, 0.0, -9.81007]            # gravity vector (z-up world frame)

  # ---- Point Cloud Preprocessing ----
  deskew: true                             # enable motion distortion compensation
  downsample_leaf_size: 0.1                # [m] pre-registration downsampling
  min_range: 0.5                           # [m] minimum point range
  max_range: 80.0                          # [m] maximum point range

  # ---- Performance ----
  expected_registration_time_ms: 15        # target <15ms (Jetson Orin / Intel x86)